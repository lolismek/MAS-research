<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shared-memory board — trace viewer</title>
<style>
  :root{
    --bg:#0f1116; --panel:#161922; --panel2:#1d2130; --line:#2a2f3e; --txt:#e7e9ee;
    --muted:#8b91a3; --accent:#6ea8fe; --reason:#c08bff; --board:#7fd8a8;
    --WebResearcher:#4d8bf0; --Analyst:#3fb27f; --Critic:#e0a13a; --Finalizer:#a47be0;
    --Selector:#7c8497; --user:#6b7280;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--txt);height:100vh;overflow:hidden}
  .app{display:grid;grid-template-columns:320px 1fr;height:100vh}
  .side{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;display:flex;flex-direction:column}
  .side h1{font-size:13px;margin:0;padding:14px 14px 6px;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
  .tlist{flex:1;overflow-y:auto;padding:4px 6px 20px}
  .titem{padding:9px 10px;border-radius:8px;cursor:pointer;margin-bottom:4px;border:1px solid transparent}
  .titem:hover{background:var(--panel2)}
  .titem.active{background:var(--panel2);border-color:var(--accent)}
  .titem .uid{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:var(--accent)}
  .titem .ns{font-size:10.5px;color:var(--muted);margin-top:1px}
  .titem .badges{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px}
  .b{font-size:10px;padding:1px 7px;border-radius:20px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  .b.ok{color:#7fd8a8;border-color:#2e5b43}.b.no{color:#f0928f;border-color:#5b2e2e}
  .main{overflow-y:auto;position:relative}
  .wrap{max-width:960px;margin:0 auto;padding:20px 26px 140px}
  .task{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 18px;margin-bottom:8px}
  .task .qtext{font-size:15px;margin:4px 0 12px}
  .kv{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;align-items:center}
  .kv .lab{color:var(--muted)} .kv .mono{font-family:ui-monospace,Menlo,monospace}
  .stats{margin-top:11px;border-top:1px solid var(--line);padding-top:10px;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 14px}
  .stats b{color:var(--txt)}
  h2.sec{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:18px 0 12px}
  .selrow{display:flex;justify-content:center}
  .selchip{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:#c2c7d4;background:var(--panel);border:1px dashed var(--Selector);border-radius:20px;padding:3px 12px;margin:4px 0;cursor:pointer;max-width:90%}
  .selchip:hover{border-color:var(--accent);color:#fff}
  .selchip .arrow{color:var(--muted)}
  .selchip .rat{color:var(--muted);font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:520px}
  .msg{display:flex;margin:10px 0;gap:10px}
  .msg .av{width:34px;height:34px;border-radius:8px;flex:0 0 34px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;background:var(--c)}
  .bubble{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:12px;padding:10px 13px;cursor:pointer;flex:1;min-width:0}
  .bubble:hover{background:var(--panel2)}
  .bubble.nopt{cursor:default}
  .bubble .who{font-weight:700;font-size:12.5px;margin-bottom:3px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .bubble .who-name{color:var(--c)}
  .bubble .meta{font-size:11px;color:var(--muted);font-weight:400}
  .bubble .txt{white-space:pre-wrap;color:#dfe2ea;font-size:13.5px;word-break:break-word}
  .pill{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:0 7px;margin-left:6px}
  .pill.r{color:var(--reason);border-color:#46356b}
  .pill.bd{color:var(--board);border-color:#2e5b43}
  .hint{color:var(--muted);font-size:12px;font-style:italic}
  .empty{padding:60px;text-align:center;color:var(--muted)}
  /* drawer */
  .drawer{position:fixed;top:0;right:0;width:min(720px,58vw);height:100vh;background:var(--panel);border-left:1px solid var(--line);box-shadow:-20px 0 50px rgba(0,0,0,.5);transform:translateX(100%);transition:transform .18s ease;overflow-y:auto;z-index:20}
  .drawer.open{transform:translateX(0)}
  .drawer .dhead{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;z-index:2}
  .drawer .dhead .x{cursor:pointer;color:var(--muted);font-size:20px;line-height:1}
  .drawer .dbody{padding:16px 18px 80px}
  .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:16px 0 5px}
  details.v{margin:6px 0}
  details.v>summary{cursor:pointer;color:var(--accent);font-size:13px;font-weight:600;list-style:none}
  details.v>summary::-webkit-details-marker{display:none}
  details.v>summary:before{content:"▸ ";color:var(--muted)}
  details.v[open]>summary:before{content:"▾ "}
  .sys{color:#aeb4c2;white-space:pre-wrap;font-size:12.5px;background:var(--panel2);border-radius:8px;padding:10px 12px;max-height:300px;overflow:auto}
  .boardseen{white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:#bfe6cf;background:#0e1b14;border:1px solid #244a36;border-radius:8px;padding:10px 12px;max-height:320px;overflow:auto}
  .round{border:1px solid var(--line);border-radius:9px;margin:12px 0;overflow:hidden}
  .round .rh{background:var(--panel2);padding:6px 11px;font-size:11px;font-family:ui-monospace,Menlo,monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .reason{background:#1a1426;border-left:3px solid var(--reason);padding:9px 12px;color:#e3d4fb;white-space:pre-wrap;font-size:13px}
  .reason .rl{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--reason);display:block;margin-bottom:4px;font-weight:700}
  .noreason{padding:7px 12px;color:var(--muted);font-size:12px;font-style:italic}
  .step{border-top:1px solid var(--line)}
  .step .sh{background:#11141c;padding:6px 11px;font-size:12px;font-family:ui-monospace,Menlo,monospace;display:flex;gap:8px;align-items:center}
  .step .sh .tname{color:#7fd8a8;font-weight:700}
  .step.board .sh{background:#0e1b14}
  .step.board .sh .tname{color:var(--board)}
  .bwrite{font-size:10px;color:var(--board);border:1px solid #2e5b43;border-radius:20px;padding:0 7px}
  .code{font-family:ui-monospace,Menlo,monospace;font-size:12px;white-space:pre-wrap;word-break:break-word;padding:9px 11px;color:#c7ccd9;max-height:320px;overflow:auto;background:#0d0f15}
  .pub{background:#15281d;border:1px solid #2e5b43;border-radius:9px;padding:11px 13px;white-space:pre-wrap;color:#dcefe3;font-size:13.5px}
  code.cmd{background:#000;padding:2px 7px;border-radius:5px;color:#7fd8a8;font-family:ui-monospace,Menlo,monospace}
</style>
</head>
<body>
<div class="app">
  <div class="side">
    <h1>shared-memory board · runs</h1>
    <div class="tlist" id="tlist"></div>
  </div>
  <div class="main"><div class="wrap" id="wrap"><div class="empty">Loading…</div></div></div>
</div>
<div class="drawer" id="drawer"><div class="dhead"><div id="dtitle"></div><div class="x" onclick="closeDrawer()">✕</div></div><div class="dbody" id="dbody"></div></div>

<script src="data.js"></script>
<script>
const DATA=(window.BOARD_DATA&&window.BOARD_DATA.runs)||[];
const ABBR={WebResearcher:'WR',Analyst:'AN',Critic:'CR',Finalizer:'FZ',Selector:'SE',user:'YOU','?':'??'};
let cur=0;
const esc=s=>(s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const col=a=>['WebResearcher','Analyst','Critic','Finalizer','Selector','user'].includes(a)?a:'user';

function renderList(){
  const el=document.getElementById('tlist');
  if(!DATA.length){el.innerHTML='<div class="empty" style="padding:30px">No board runs found.<br><br>Run <code>build_board_view.py</code> after a <code>--shared-memory</code> run.</div>';return;}
  el.innerHTML=DATA.map((r,i)=>{
    const em=r.result.exact_match, nc=r.result.board_note_count;
    return `<div class="titem ${i===cur?'active':''}" onclick="pick(${i})">
      <div class="uid">${esc(r.uuid)} · ${esc(r.run)}</div>
      <div class="ns">${esc(r.namespace)}</div>
      <div class="badges">
        <span class="b ${em?'ok':'no'}">${em?'exact_match':'no match'}</span>
        <span class="b">${nc==null?'?':nc} notes</span>
        <span class="b">${r.timeline.length} turns</span>
      </div></div>`;
  }).join('');
}
function pick(i){cur=i;renderList();renderRun();closeDrawer();document.querySelector('.main').scrollTop=0;}

function renderRun(){
  const r=DATA[cur], res=r.result, em=res.exact_match;
  let html=`<div class="task">
    <div class="kv"><span class="mono" style="color:var(--accent)">${esc(r.namespace)} / ${esc(r.uuid)} / ${esc(r.run)}</span></div>
    <div class="qtext">${esc(r.prompt)}</div>
    <div class="kv">
      <span><span class="lab">expected:</span> <b class="mono">${esc(r.expected)}</b></span>
      <span><span class="lab">final:</span> <b class="mono">${res.final_answer==null?'—':esc(res.final_answer)}</b></span>
      <span><span class="lab">outcome:</span> <b style="color:${em?'#7fd8a8':'#f0928f'}">${em?'correct':'not correct'}</b></span>
    </div>
    <div class="stats">
      <span>notes <b>${res.board_note_count==null?'?':res.board_note_count}</b></span>
      <span>revises <b>${res.board_revise_count==null?'?':res.board_revise_count}</b></span>
      <span>authors <b>${(res.board_authors||[]).join(', ')||'—'}</b></span>
    </div></div>`;

  if(r.no_data || !r.timeline.length){
    html+=`<div class="empty">No proxy rows were logged for this run, so the per-message trace can't be replayed.${r.no_data?' (Only console_log.txt exists.)':''}</div>`;
    document.getElementById('wrap').innerHTML=html; return;
  }

  html+=`<h2 class="sec">Group chat — click a message for its private reasoning + tool loop + the board it saw · click a Selector chip for routing</h2>
    <div class="msg" style="--c:var(--user)"><div class="av">YOU</div>
      <div class="bubble nopt"><div class="who"><span class="who-name">Task</span></div><div class="txt">${esc(r.prompt)}</div></div></div>`;

  r.timeline.forEach((turn,idx)=>{
    if(turn.selector){
      const s=turn.selector, rat=s.rationale||s.reasoning||'';
      html+=`<div class="selrow"><div class="selchip" onclick="showSelector(${idx})">🧭 Selector <span class="arrow">→</span> <b>${esc(s.choice)}</b>${rat?` <span class="rat">${esc(rat)}</span>`:''}${s.reasoning?' 💭':''}</div></div>`;
    }
    const src=turn.source, c=col(src);
    const nTools=turn.rounds.reduce((a,rd)=>a+rd.tools.length,0);
    const nR=turn.rounds.filter(rd=>rd.reasoning).length;
    let meta=`${turn.n_internal_calls} round${turn.n_internal_calls!==1?'s':''} · ${nTools} tool${nTools!==1?'s':''}`;
    if(nR) meta+=` <span class="pill r">${nR} 💭</span>`;
    if(turn.n_writes) meta+=` <span class="pill bd">${turn.n_writes} board write${turn.n_writes!==1?'s':''}</span>`;
    html+=`<div class="msg" style="--c:var(--${c})"><div class="av">${ABBR[src]||'??'}</div>
      <div class="bubble" onclick="showTurn(${idx})">
        <div class="who"><span class="who-name">${esc(src)}</span><span class="meta">${meta} ▸</span></div>
        <div class="txt">${esc(turn.published)||'<span class=hint>(no published text)</span>'}</div>
      </div></div>`;
  });
  document.getElementById('wrap').innerHTML=html;
}

function showTurn(idx){
  const turn=DATA[cur].timeline[idx];
  let h=`<div class="lbl">Routed here by</div>`;
  h+=turn.selector?`<div class="selchip" style="cursor:pointer" onclick="showSelector(${idx})">🧭 chose <b>&nbsp;${esc(turn.selector.choice)}</b> — view routing</div>`:`<div class="hint">first / forced turn</div>`;
  if(turn.board_seen){
    h+=`<div class="lbl">📋 Scratchpad this agent read at turn start</div><div class="boardseen">${esc(turn.board_seen)}</div>`;
  }else{
    h+=`<div class="lbl">📋 Scratchpad at turn start</div><div class="hint">empty — nothing on the board yet</div>`;
  }
  h+=`<div class="lbl">System role</div><details class="v"><summary>show system prompt</summary><div class="sys">${esc(turn.system)}</div></details>`;
  h+=`<div class="lbl">Private ReAct loop — ${turn.rounds.length} round(s). Reasoning (💭) and tool calls are INVISIBLE to teammates; board writes are the exception.</div>`;
  turn.rounds.forEach((rd,i)=>{
    h+=`<div class="round"><div class="rh">round ${i+1}${rd.publish!==null?' · publishes':''}</div>`;
    h+= rd.reasoning ? `<div class="reason"><span class="rl">💭 private reasoning (before acting)</span>${esc(rd.reasoning)}</div>`
                     : `<div class="noreason">no reasoning summary this round</div>`;
    rd.tools.forEach(s=>{
      const isB=s.name==='add_note'||s.name==='revise_note';
      h+=`<div class="step ${isB?'board':''}"><div class="sh">${isB?'📋':'🔧'} <span class="tname">${esc(s.name)}</span>${isB?'<span class="bwrite">board write</span>':''}</div>
        ${s.args?`<div class="code">${esc(s.args)}</div>`:''}
        ${s.result!=null?`<div class="lbl" style="margin:6px 0 0;padding:0 11px">result</div><div class="code">${esc(s.result)}</div>`:'<div class="hint" style="padding:6px 11px">(no result captured)</div>'}
      </div>`;
    });
    if(rd.publish!==null){
      h+=`<div class="step"><div class="lbl" style="margin:8px 0 4px;padding:0 11px;color:#7fd8a8">▼ published to the group (the only thing teammates saw)</div><div class="pub" style="margin:0 11px 11px">${esc(rd.publish)||'(empty)'}</div></div>`;
    }
    h+=`</div>`;
  });
  openDrawer(`${turn.source} · turn ${idx+1}`,h);
}

function showSelector(idx){
  const s=DATA[cur].timeline[idx].selector;
  if(!s){openDrawer('Selector','<div class="hint">No selector call recorded.</div>');return;}
  let h=`<div class="lbl">Chose</div><div class="pub" style="background:var(--panel2);border-color:var(--line);color:#dfe2ea">→ ${esc(s.choice)}</div>`;
  if(s.rationale) h+=`<div class="lbl">Routing note written to the board ("why I picked X")</div><div class="boardseen">${esc(s.rationale)}</div>`;
  if(s.reasoning) h+=`<div class="lbl">💭 Selector's private reasoning summary</div><div class="reason">${esc(s.reasoning)}</div>`;
  h+=`<div class="lbl">Routing context the selector saw (roles + conversation + the board, spliced into {board})</div><div class="code" style="max-height:none">${esc(s.prompt)}</div>`;
  openDrawer(`Selector → ${esc(s.choice)}`,h);
}

function openDrawer(title,html){document.getElementById('dtitle').innerHTML=`<b>${title}</b>`;document.getElementById('dbody').innerHTML=html;document.getElementById('drawer').classList.add('open');}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();});

renderList();
const def=DATA.findIndex(r=>r.namespace.includes('openai')&&r.uuid.startsWith('50f58759')&&r.run==='run_2');
if(def>=0) cur=def;
renderRun();
</script>
</body>
</html>

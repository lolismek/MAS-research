<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>split4_openai — trace failure analysis</title>
<style>
  :root{
    --bg:#0f1116; --panel:#161922; --panel2:#1d2130; --line:#2a2f3e; --txt:#e7e9ee;
    --muted:#8b91a3; --accent:#6ea8fe;
    --wr:#4d8bf0; --an:#3fb27f; --cr:#e0a13a; --fi:#a47be0; --us:#6b7280; --sel:#5a6275;
    --reason:#c08bff;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--txt);height:100vh;overflow:hidden}
  .app{display:grid;grid-template-columns:330px 1fr;height:100vh}
  .side{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;display:flex;flex-direction:column}
  .side h1{font-size:13px;margin:0;padding:14px 14px 4px;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
  .stats{padding:0 14px 8px;font-size:11px;color:var(--muted);line-height:1.7}
  .stats b{color:var(--txt)}
  .stats .seg{display:inline-block;margin-right:9px;white-space:nowrap}
  .search{margin:6px 10px 8px;padding:7px 9px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;color:var(--txt);font-size:13px}
  .tlist{flex:1;overflow-y:auto;padding:0 6px 20px}
  .titem{padding:8px 9px;border-radius:8px;cursor:pointer;margin-bottom:3px;border:1px solid transparent}
  .titem:hover{background:var(--panel2)}
  .titem.active{background:var(--panel2);border-color:var(--accent)}
  .titem .uid{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--accent)}
  .titem .q{color:var(--muted);font-size:12px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .badges{margin-top:5px;display:flex;flex-wrap:wrap;gap:4px}
  .b{font-size:10px;padding:1px 6px;border-radius:20px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  .b.ok{color:#7fd8a8;border-color:#2e5b43}.b.no{color:#f0928f;border-color:#5b2e2e}.b.ab{color:#e0c060;border-color:#5b522e}.b.wr{color:#f0b27f;border-color:#5b412e}
  .b.gen-strong{color:#ff8a8a;border-color:#7a2e2e;background:#2a1414}
  .b.gen-moderate{color:#ffc06a;border-color:#6b4a1e;background:#241a0e}
  .b.gen-weak{color:#d3b2f0;border-color:#46356b}
  .b.cat{background:var(--panel)}
  .main{overflow-y:auto;position:relative}
  .wrap{max-width:940px;margin:0 auto;padding:22px 26px 140px}
  .task{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:18px}
  .task .qtext{font-size:15px;margin:2px 0 12px}
  .kv{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;margin-bottom:6px}
  .kv .lab{color:var(--muted)}
  .cause{margin:10px 0 4px;padding:10px 12px;background:#1a1410;border:1px solid #4a3a22;border-radius:9px;color:#f3d9b8;font-size:13.5px}
  .cause .lab{color:#c79a5e;text-transform:uppercase;font-size:10px;letter-spacing:.06em;display:block;margin-bottom:3px}
  .verdict{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
  .vrow{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;margin-bottom:8px;align-items:center}
  .chip{font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:#cfd3de;background:var(--panel2)}
  .chip.mast{font-family:ui-monospace,Menlo,monospace;color:#9fd0ff;border-color:#2e4a6b}
  .chip.mt{color:#d3b2f0;border-color:#46356b}
  details.v{margin:6px 0}
  details.v>summary{cursor:pointer;color:var(--accent);font-size:13px;font-weight:600;list-style:none}
  details.v>summary::-webkit-details-marker{display:none}
  details.v>summary:before{content:"▸ ";color:var(--muted)}
  details.v[open]>summary:before{content:"▾ "}
  details.v .body{padding:8px 4px 4px;color:#cfd3de;white-space:pre-wrap}
  .fp{border-left:3px solid var(--cr);background:var(--panel2);padding:7px 10px;margin:6px 0;border-radius:5px}
  .fp .hd{font-size:12px;color:#e0c79a;font-weight:600}
  .fp .ev{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:#bfc6d4;margin-top:4px;white-space:pre-wrap}
  .ev{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--panel2);border-left:3px solid var(--sel);padding:6px 9px;margin:5px 0;border-radius:4px;white-space:pre-wrap;color:#c7ccd9}
  h2.sec{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:6px 0 14px}
  .selchip{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:#c2c7d4;background:var(--panel);border:1px dashed var(--sel);border-radius:20px;padding:3px 12px;margin:4px 0;cursor:pointer}
  .selchip:hover{border-color:var(--accent);color:#fff}
  .selchip.bad{border-color:#7a2e2e;color:#f0928f}
  .selrow{display:flex;justify-content:center}
  .selchip .arrow{color:var(--muted)}
  .msg{display:flex;margin:10px 0;gap:10px}
  .msg .av{width:34px;height:34px;border-radius:8px;flex:0 0 34px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
  .bubble{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 13px;cursor:pointer;flex:1;border-left-width:3px}
  .bubble:hover{background:var(--panel2)}
  .bubble .who{font-weight:700;font-size:12.5px;margin-bottom:3px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .bubble .meta{font-size:11px;color:var(--muted);font-weight:400}
  .bubble .txt{white-space:pre-wrap;color:#dfe2ea;font-size:13.5px}
  .src-WebResearcher{--c:var(--wr)} .src-Analyst{--c:var(--an)} .src-Critic{--c:var(--cr)} .src-Finalizer{--c:var(--fi)} .src-user{--c:var(--us)} .src-\?{--c:var(--us)}
  .av{background:var(--c)} .bubble{border-left-color:var(--c)}
  .who .who-name{color:var(--c)}
  .pill{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:0 7px;margin-left:6px}
  .pill.r{color:var(--reason);border-color:#46356b}
  .drawer{position:fixed;top:0;right:0;width:min(700px,56vw);height:100vh;background:var(--panel);border-left:1px solid var(--line);box-shadow:-20px 0 50px rgba(0,0,0,.5);transform:translateX(100%);transition:transform .18s ease;overflow-y:auto;z-index:20}
  .drawer.open{transform:translateX(0)}
  .drawer .dhead{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;z-index:2}
  .drawer .dhead .x{cursor:pointer;color:var(--muted);font-size:20px;line-height:1}
  .drawer .dbody{padding:16px 18px 80px}
  .round{border:1px solid var(--line);border-radius:9px;margin:12px 0;overflow:hidden}
  .round .rh{background:var(--panel2);padding:6px 11px;font-size:11px;font-family:ui-monospace,Menlo,monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .reason{background:#1a1426;border-left:3px solid var(--reason);padding:9px 12px;color:#e3d4fb;white-space:pre-wrap;font-size:13px}
  .reason .rl{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--reason);display:block;margin-bottom:4px;font-weight:700}
  .noreason{padding:7px 12px;color:var(--muted);font-size:12px;font-style:italic}
  .step{border-top:1px solid var(--line)}
  .step .sh{background:#11141c;padding:6px 11px;font-size:12px;font-family:ui-monospace,Menlo,monospace;display:flex;gap:8px;align-items:center}
  .step .sh .tname{color:#7fd8a8;font-weight:700}
  .code{font-family:ui-monospace,Menlo,monospace;font-size:12px;white-space:pre-wrap;word-break:break-word;padding:9px 11px;color:#c7ccd9;max-height:320px;overflow:auto;background:#0d0f15}
  .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:16px 0 5px}
  .pub{background:#15281d;border:1px solid #2e5b43;border-radius:9px;padding:11px 13px;white-space:pre-wrap;color:#dcefe3;font-size:13.5px}
  .sys{color:#aeb4c2;white-space:pre-wrap;font-size:12.5px;background:var(--panel2);border-radius:8px;padding:10px 12px}
  .hint{color:var(--muted);font-size:12px}
  .empty{padding:60px;text-align:center;color:var(--muted)}
  .err{margin:40px auto;max-width:560px;background:#241a1a;border:1px solid #5b2e2e;border-radius:10px;padding:18px}
  code.cmd{background:#000;padding:2px 7px;border-radius:5px;color:#7fd8a8;font-family:ui-monospace,Menlo,monospace}
</style>
</head>
<body>
<div class="app">
  <div class="side">
    <h1>split4_openai · failure analysis</h1>
    <div class="stats" id="stats"></div>
    <input class="search" id="search" placeholder="filter by id / category / outcome / misalignment / MAST…">
    <div class="tlist" id="tlist"></div>
  </div>
  <div class="main"><div class="wrap" id="wrap"><div class="empty">Loading traces…</div></div></div>
</div>
<div class="drawer" id="drawer"><div class="dhead"><div id="dtitle"></div><div class="x" onclick="closeDrawer()">✕</div></div><div class="dbody" id="dbody"></div></div>

<script>
const ABBR={WebResearcher:'WR',Analyst:'AN',Critic:'CR',Finalizer:'FZ',user:'YOU','?':'??'};
let TRACES=[], cur=null;
const esc=s=>(s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const V=t=>t.verdict||{};

function outClass(o){return o==='correct'?'ok':o==='wrong_answer'?'wr':o==='infra_failure'?'ab':'no'}
function genClass(g){return g&&g!=='none'?'gen-'+g:''}

function renderStats(){
  const c={}, m={}, fc={};
  TRACES.forEach(t=>{const v=V(t);
    c[v.outcome]=(c[v.outcome]||0)+1; m[v.genuine_misalignment]=(m[v.genuine_misalignment]||0)+1;});
  const seg=(o,lab)=>`<span class="seg"><b>${o||0}</b> ${lab}</span>`;
  document.getElementById('stats').innerHTML=
    `${seg(c.correct,'correct')}${seg(c.wrong_answer,'wrong')}${seg(c.no_answer,'no-answer')}${seg(c.infra_failure,'infra')}<br>`+
    `misalign: ${seg(m.strong,'strong')}${seg(m.moderate,'moderate')}${seg(m.weak,'weak')}${seg(m.none,'none')}`;
}

function renderList(filter=''){
  const f=filter.toLowerCase();
  const el=document.getElementById('tlist'); el.innerHTML='';
  TRACES.forEach((t,i)=>{
    const v=V(t);
    const hay=`${t.uid8} ${t.category} ${v.outcome} ${v.genuine_misalignment} ${v.failure_category} ${(v.mast_codes||[]).join(' ')} ${(v.misalignment_types||[]).join(' ')}`.toLowerCase();
    if(f && !hay.includes(f)) return;
    const o=v.outcome||'?', g=v.genuine_misalignment;
    const d=document.createElement('div');
    d.className='titem'+(cur===i?' active':'');
    d.onclick=()=>select(i);
    d.innerHTML=`<div class="uid">${t.uid8}</div>
      <div class="q">${esc(t.question).slice(0,120)}</div>
      <div class="badges">
        <span class="b cat">${t.category} · L${t.level}</span>
        <span class="b ${outClass(o)}">${o}${t.exact_match?' ✓':''}</span>
        ${g&&g!=='none'?`<span class="b ${genClass(g)}">misalign:${g}</span>`:''}
      </div>`;
    el.appendChild(d);
  });
}

function select(i){cur=i;renderList(document.getElementById('search').value);renderTrace(TRACES[i]);closeDrawer();document.querySelector('.main').scrollTop=0;}

function verdictBlock(t){
  const v=V(t); if(!v.task_description && !v.primary_cause) return '';
  const codes=(v.mast_codes||[]).map(c=>`<span class="chip mast">${esc(c)}</span>`).join(' ')||'<span class="hint">none</span>';
  const mts=(v.misalignment_types||[]).map(c=>`<span class="chip mt">${esc(c)}</span>`).join(' ')||'<span class="hint">none</span>';
  const fps=(v.key_failure_points||[]).map(p=>`<div class="fp"><div class="hd">turn ${esc(p.turn)} · ${esc(p.agent)} — ${esc(p.what)}</div>${p.evidence?`<div class="ev">${esc(p.evidence)}</div>`:''}</div>`).join('');
  const ev=(v.key_evidence||[]).map(e=>`<div class="ev">${esc(e)}</div>`).join('');
  return `<div class="verdict">
    <div class="vrow">
      <span class="chip ${outClass(v.outcome)}" style="border-width:1px">${esc(v.outcome)}</span>
      <span><span class="lab">misalignment:</span> <b style="color:${v.genuine_misalignment==='none'?'var(--muted)':'#d3b2f0'}">${esc(v.genuine_misalignment)}</b></span>
      <span><span class="lab">category:</span> ${esc(v.failure_category)}</span>
    </div>
    <div class="cause"><span class="lab">primary cause</span>${esc(v.primary_cause)}</div>
    <div class="vrow" style="margin-top:10px"><span class="lab">MAST codes:</span> ${codes}</div>
    <details class="v" open><summary>What the task asks (read me first)</summary><div class="body">${esc(v.task_description)}</div></details>
    <details class="v" open><summary>How the trace went</summary><div class="body">${esc(v.trace_narrative)}</div></details>
    <details class="v"><summary>Reasoning vs published (the private↔public gap)</summary><div class="body">${esc(v.reasoning_vs_published)}</div></details>
    <details class="v"><summary>Open-ended diagnosis</summary><div class="body">${esc(v.open_ended_diagnosis)}</div></details>
    <details class="v"><summary>MAST rationale</summary><div class="body">${esc(v.mast_rationale)}</div></details>
    <details class="v"><summary>Misalignment types</summary><div class="body">${mts}</div></details>
    ${fps?`<details class="v"><summary>Key failure points (${(v.key_failure_points||[]).length})</summary><div class="body">${fps}</div></details>`:''}
    ${ev?`<details class="v"><summary>Key evidence</summary><div class="body">${ev}</div></details>`:''}
  </div>`;
}

function renderTrace(t){
  const v=V(t), o=v.outcome||'?';
  let html=`<div class="task src-user">
    <div class="kv"><span class="uid" style="font-family:ui-monospace,Menlo,monospace;color:var(--accent)">${t.uid8}</span>
      <span class="b cat">${t.category} · L${t.level}</span>
      <span class="b ${outClass(o)}">${o}</span>
      <span class="lab">${t.seconds}s · rc=${esc(t.rc)}</span></div>
    <div class="qtext">${esc(t.question)}</div>
    <div class="kv"><span><span class="lab">expected:</span> <b>${esc(t.expected_answer)}</b></span>
      <span><span class="lab">final:</span> <b>${esc(t.final_answer)}</b></span>
      <span><span class="lab">agents spoke:</span> ${t.participation.n_agents_spoke}</span>
      <span><span class="lab">turns per agent:</span> ${esc(JSON.stringify(t.participation.speaker_turns||{}))}</span></div>
    ${verdictBlock(t)}
  </div>`;

  if(t.no_data || !t.timeline.length){
    html+=`<div class="empty">No model calls were logged for this run (infrastructure failure — subprocess hung). Nothing to replay.</div>`;
    document.getElementById('wrap').innerHTML=html; return;
  }

  html+=`<h2 class="sec">Group chat — click a message to inspect its PRIVATE reasoning + tool loop · click a selector chip for routing</h2>
  <div class="msg src-user"><div class="av">YOU</div><div class="bubble" style="cursor:default"><div class="who"><span class="who-name">Task</span></div><div class="txt">${esc(t.question)}</div></div></div>`;

  t.timeline.forEach((turn,idx)=>{
    if(turn.selector){
      const choice=turn.selector.choice||turn.source;
      const bad=choice && choice!==turn.source && !ABBR[choice];
      html+=`<div class="selrow"><div class="selchip ${bad?'bad':''}" onclick="showSelector(${idx})">🧭 Selector <span class="arrow">→</span> <b>${esc(choice)}</b>${turn.selector.reasoning?' 💭':''}</div></div>`;
    }
    const src=turn.source in ABBR?turn.source:'?';
    const nTools=turn.rounds.reduce((a,r)=>a+r.tools.length,0);
    const nR=turn.rounds.filter(r=>r.reasoning).length;
    const meta=`${turn.n_internal_calls} round${turn.n_internal_calls>1?'s':''} · ${nTools} tool call${nTools!==1?'s':''}`;
    html+=`<div class="msg src-${src}">
      <div class="av">${ABBR[src]}</div>
      <div class="bubble" onclick="showTurn(${idx})">
        <div class="who"><span class="who-name">${esc(turn.source)}</span><span class="meta">${meta}${nR?` <span class="pill r">${nR} 💭 reasoning</span>`:''} ▸</span></div>
        <div class="txt">${esc(turn.published)||'<span class=hint>(no published text)</span>'}</div>
      </div></div>`;
  });
  document.getElementById('wrap').innerHTML=html;
}

function showTurn(idx){
  const t=TRACES[cur], turn=t.timeline[idx];
  let h=`<div class="lbl">Selector routed to this agent</div>`;
  h+=turn.selector?`<div class="selchip" onclick="showSelector(${idx})" style="cursor:pointer">🧭 chose <b>&nbsp;${esc(turn.selector.choice)}</b> — view routing context</div>`:`<div class="hint">first/forced turn</div>`;
  h+=`<div class="lbl">System role (what this agent was told to be)</div><details class="v"><summary>show system prompt</summary><div class="body sys">${esc(turn.system)}</div></details>`;
  h+=`<div class="lbl">Private ReAct loop — ${turn.rounds.length} round(s). Reasoning summaries (💭) and tool calls are INVISIBLE to teammates.</div>`;
  turn.rounds.forEach((rd,i)=>{
    h+=`<div class="round"><div class="rh">round ${i+1}${rd.publish!==null?' · publishes':''}</div>`;
    if(rd.reasoning){
      h+=`<div class="reason"><span class="rl">💭 private reasoning summary (before acting)</span>${esc(rd.reasoning)}</div>`;
    }else{
      h+=`<div class="noreason">no reasoning summary emitted this round</div>`;
    }
    rd.tools.forEach(s=>{
      h+=`<div class="step"><div class="sh">🔧 <span class="tname">${esc(s.name)}</span></div>
        ${s.args?`<div class="code">${esc(s.args)}</div>`:''}
        ${s.result!=null?`<div class="lbl" style="margin:6px 0 0;padding:0 11px">result</div><div class="code">${esc(s.result)}</div>`:'<div class="hint" style="padding:6px 11px">(no result captured)</div>'}
      </div>`;
    });
    if(rd.publish!==null){
      h+=`<div class="step"><div class="lbl" style="margin:8px 0 4px;padding:0 11px;color:#7fd8a8">▼ published to the group (the ONLY thing teammates saw)</div><div class="pub" style="margin:0 11px 11px">${esc(rd.publish)||'(empty)'}</div></div>`;
    }
    h+=`</div>`;
  });
  openDrawer(`${turn.source} · turn ${idx+1}`, h);
}

function showSelector(idx){
  const t=TRACES[cur], turn=t.timeline[idx], s=turn.selector;
  if(!s){openDrawer('Selector','<div class="hint">No selector call recorded for this turn.</div>');return;}
  let h=`<div class="lbl">Selector's choice</div><div class="pub" style="background:var(--panel2);border-color:var(--line);color:#dfe2ea">→ ${esc(s.choice)}</div>`;
  if(s.reasoning){
    h+=`<div class="lbl">💭 Selector's private reasoning (why it routed this way)</div><div class="reason">${esc(s.reasoning)}</div>`;
  }
  h+=`<div class="lbl">Routing context the selector saw (roles + conversation so far + routing rules). The model returns only the member name.</div>
    <div class="code" style="max-height:none">${esc(s.prompt)}</div>`;
  openDrawer(`Selector → ${esc(s.choice)}`, h);
}

function openDrawer(title,html){document.getElementById('dtitle').innerHTML=`<b>${title}</b>`;document.getElementById('dbody').innerHTML=html;document.getElementById('drawer').classList.add('open');}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();});
document.getElementById('search').addEventListener('input',e=>renderList(e.target.value));

fetch('traces.json').then(r=>r.json()).then(d=>{
  TRACES=d; renderStats(); renderList(); select(0);
}).catch(err=>{
  document.getElementById('wrap').innerHTML=`<div class="err"><b>Could not load traces.json.</b><br><br>
   Browsers block <code class="cmd">fetch()</code> from <code class="cmd">file://</code>. Serve this folder over HTTP:<br><br>
   <code class="cmd">cd reproduction/viewer_openai &amp;&amp; python3 -m http.server 8012</code><br><br>
   then open <code class="cmd">http://localhost:8012/</code><br><br><span class="hint">${esc(err)}</span></div>`;
});
</script>
</body>
</html>

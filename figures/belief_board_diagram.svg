<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="410" viewBox="0 0 1040 410" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>

  <!-- ============ Agent A's trace ============ -->
  <text x="45" y="52" font-size="16" font-weight="bold" fill="#333">Agent A's trace</text>
  <rect x="40" y="65" width="330" height="315" rx="8" fill="#eef4fb" stroke="#4a7fb5" stroke-width="1.5"/>

  <text x="58" y="100" font-size="12" font-family="Menlo, monospace" fill="#444">…thinking about Paris pop…</text>

  <!-- write-tool call (agent's own) -->
  <rect x="50" y="112" width="310" height="26" rx="4" fill="#ece3f7" stroke="#7a5fb0" stroke-width="1"/>
  <text x="58" y="129" font-size="11" font-family="Menlo, monospace" fill="#5a3f90">add_belief("Paris pop", "≈2.1M city", .8)</text>

  <text x="58" y="164" font-size="12" font-family="Menlo, monospace" fill="#444">wait, maybe they mean metro?</text>

  <rect x="50" y="176" width="310" height="26" rx="4" fill="#ece3f7" stroke="#7a5fb0" stroke-width="1"/>
  <text x="58" y="193" font-size="11" font-family="Menlo, monospace" fill="#5a3f90">revise_belief(b1, "≈11M metro?", .5)</text>

  <text x="58" y="228" font-size="12" font-family="Menlo, monospace" fill="#444">and is this even answerable?</text>

  <rect x="50" y="240" width="310" height="26" rx="4" fill="#ece3f7" stroke="#7a5fb0" stroke-width="1"/>
  <text x="58" y="257" font-size="11" font-family="Menlo, monospace" fill="#5a3f90">add_belief("do-ability", "unclear", .3)</text>

  <text x="58" y="330" font-size="11" font-style="italic" fill="#88a">A writes live, with its own</text>
  <text x="58" y="346" font-size="11" font-style="italic" fill="#88a">tools, during its own turn</text>

  <!-- arrow trace -> board -->
  <line x1="372" y1="190" x2="452" y2="190" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="412" y="180" font-size="11" fill="#555" text-anchor="middle">add /</text>
  <text x="412" y="202" font-size="11" fill="#555" text-anchor="middle">revise</text>

  <!-- ============ Shared belief board ============ -->
  <text x="460" y="52" font-size="16" font-weight="bold" fill="#333">Shared belief board</text>
  <rect x="455" y="65" width="380" height="270" rx="8" fill="#faf7fe" stroke="#7a5fb0" stroke-width="1.5"/>

  <!-- b1 superseded -->
  <rect x="470" y="90" width="350" height="52" rx="5" fill="#f0f0f0" stroke="#bbb"/>
  <text x="482" y="112" font-size="11.5" font-family="Menlo, monospace" fill="#999">[b1·A] Paris pop: ≈2.1M city (.80)</text>
  <text x="482" y="130" font-size="10.5" font-style="italic" fill="#aaa">superseded → b2</text>

  <!-- b2 active -->
  <rect x="470" y="152" width="350" height="52" rx="5" fill="#ece3f7" stroke="#7a5fb0"/>
  <text x="482" y="174" font-size="11.5" font-family="Menlo, monospace" fill="#4a3573">[b2·A] Paris pop: ≈11M metro? (.50)</text>
  <text x="482" y="192" font-size="10.5" font-style="italic" fill="#6a5a8a">revises b1</text>

  <!-- b3 active -->
  <rect x="470" y="214" width="350" height="52" rx="5" fill="#ece3f7" stroke="#7a5fb0"/>
  <text x="482" y="236" font-size="11.5" font-family="Menlo, monospace" fill="#4a3573">[b3·A] do-ability: unclear (.30)</text>
  <text x="482" y="254" font-size="10.5" font-style="italic" fill="#6a5a8a">A's own stance</text>

  <text x="470" y="300" font-size="11" font-style="italic" fill="#88a">nothing deleted — revisions append</text>
  <text x="470" y="316" font-size="11" font-style="italic" fill="#88a">and point back, so B sees the change</text>

  <!-- arrow board -> agent B -->
  <line x1="837" y1="190" x2="877" y2="205" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="900" y="178" font-size="11" fill="#555" text-anchor="middle">reads at</text>
  <text x="900" y="192" font-size="11" fill="#555" text-anchor="middle">start</text>

  <!-- ============ Agent B ============ -->
  <rect x="875" y="205" width="140" height="90" rx="10" fill="#e9f4ec" stroke="#5aa15a" stroke-width="1.5"/>
  <text x="945" y="245" font-size="15" font-weight="bold" fill="#2f6b2f" text-anchor="middle">Agent B</text>
  <text x="945" y="266" font-size="11" fill="#3f7a3f" text-anchor="middle">reads board at</text>
  <text x="945" y="281" font-size="11" fill="#3f7a3f" text-anchor="middle">start of its turn</text>
</svg>

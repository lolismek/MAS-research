<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="440" viewBox="0 0 1040 440" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>

  <!-- ============ Agent A's trace ============ -->
  <text x="45" y="52" font-size="16" font-weight="bold" fill="#333">Agent A's trace</text>
  <rect x="40" y="65" width="300" height="320" rx="8" fill="#eef4fb" stroke="#4a7fb5" stroke-width="1.5"/>

  <!-- plain line -->
  <text x="58" y="100" font-size="12.5" font-family="Menlo, monospace" fill="#444">Searching for Paris population…</text>

  <!-- objective highlight -->
  <rect x="50" y="118" width="280" height="26" rx="4" fill="#e2f1e2" stroke="#5aa15a" stroke-width="1"/>
  <text x="58" y="135" font-size="12.5" font-family="Menlo, monospace" fill="#2f6b2f">Wikipedia: Paris ≈ 2.1M (city)</text>

  <!-- plain -->
  <text x="58" y="170" font-size="12.5" font-family="Menlo, monospace" fill="#444">Wait, do they mean the metro?</text>

  <!-- subjective highlight -->
  <rect x="50" y="188" width="280" height="26" rx="4" fill="#fbe4e4" stroke="#c46a6a" stroke-width="1"/>
  <text x="58" y="205" font-size="12.5" font-family="Menlo, monospace" fill="#9c3b3b">Hmm… not cleanly answerable.</text>

  <!-- subjective highlight 2 -->
  <rect x="50" y="222" width="280" height="26" rx="4" fill="#fbe4e4" stroke="#c46a6a" stroke-width="1"/>
  <text x="58" y="239" font-size="12.5" font-family="Menlo, monospace" fill="#9c3b3b">I'll just answer 2.1M and move on.</text>

  <!-- plain -->
  <text x="58" y="274" font-size="12.5" font-family="Menlo, monospace" fill="#444">Final answer: 2.1M</text>
  <text x="58" y="340" font-size="11" font-style="italic" fill="#88a">(full trace, incl. hidden</text>
  <text x="58" y="356" font-size="11" font-style="italic" fill="#88a"> reasoning)</text>

  <!-- ============ Observer LLM ============ -->
  <rect x="400" y="180" width="150" height="80" rx="10" fill="#ece3f7" stroke="#7a5fb0" stroke-width="1.5"/>
  <text x="475" y="212" font-size="15" font-weight="bold" fill="#4a3573" text-anchor="middle">Observer</text>
  <text x="475" y="232" font-size="15" font-weight="bold" fill="#4a3573" text-anchor="middle">LLM</text>
  <text x="475" y="250" font-size="11" fill="#6a5a8a" text-anchor="middle">(2nd model)</text>

  <!-- arrow trace -> observer -->
  <line x1="342" y1="220" x2="398" y2="220" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="370" y="210" font-size="11" fill="#555" text-anchor="middle">reads</text>

  <!-- arrow observer -> table -->
  <line x1="552" y1="200" x2="612" y2="150" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="582" y="168" font-size="11" fill="#555" text-anchor="middle">maps</text>

  <!-- ============ Belief table ============ -->
  <text x="615" y="52" font-size="16" font-weight="bold" fill="#333">Belief table</text>

  <!-- header -->
  <rect x="615" y="90" width="180" height="40" fill="#d9e6f2" stroke="#888"/>
  <rect x="795" y="90" width="150" height="40" fill="#d9e6f2" stroke="#888"/>
  <rect x="945" y="90" width="55"  height="40" fill="#d9e6f2" stroke="#888"/>
  <text x="705" y="115" font-size="12.5" font-weight="bold" fill="#333" text-anchor="middle">object</text>
  <text x="870" y="115" font-size="12.5" font-weight="bold" fill="#333" text-anchor="middle">A's belief</text>
  <text x="972" y="115" font-size="12.5" font-weight="bold" fill="#333" text-anchor="middle">conf</text>

  <!-- row 1: observation -->
  <rect x="615" y="130" width="180" height="60" fill="#eef8ee" stroke="#888"/>
  <rect x="795" y="130" width="150" height="60" fill="#eef8ee" stroke="#888"/>
  <rect x="945" y="130" width="55"  height="60" fill="#eef8ee" stroke="#888"/>
  <text x="625" y="155" font-size="12" fill="#333">Paris pop.</text>
  <text x="625" y="172" font-size="10" fill="#5aa15a">observation</text>
  <text x="805" y="164" font-size="12" fill="#333">≈ 2.1M (city)</text>
  <text x="972" y="164" font-size="12" fill="#333" text-anchor="middle">0.80</text>

  <!-- row 2: belief -->
  <rect x="615" y="190" width="180" height="60" fill="#fdeeee" stroke="#888"/>
  <rect x="795" y="190" width="150" height="60" fill="#fdeeee" stroke="#888"/>
  <rect x="945" y="190" width="55"  height="60" fill="#fdeeee" stroke="#888"/>
  <text x="625" y="215" font-size="12" fill="#333">task do-ability</text>
  <text x="625" y="232" font-size="10" fill="#c46a6a">belief</text>
  <text x="805" y="215" font-size="12" fill="#333">not cleanly</text>
  <text x="805" y="231" font-size="12" fill="#333">answerable</text>
  <text x="972" y="224" font-size="12" fill="#333" text-anchor="middle">0.30</text>

  <!-- legend -->
  <rect x="615" y="300" width="14" height="14" fill="#eef8ee" stroke="#5aa15a"/>
  <text x="636" y="312" font-size="11.5" fill="#444">objective object  →  shared memory (found fact)</text>
  <rect x="615" y="322" width="14" height="14" fill="#fdeeee" stroke="#c46a6a"/>
  <text x="636" y="334" font-size="11.5" fill="#444">subjective object  →  belief / stance (e.g. hallucination warning)</text>
</svg>
